trigger: none
pr: none

name: $(SourceBranchName)-Official-$(Date:yyyy-MM-dd)$(Rev:r)

parameters:
  - name: signingEnabled
    displayName: Sign the extension (requires ESRP onboarding)
    type: boolean
    default: true

  # Set false for a diagnostic run: npm then resolves straight from the public
  # registry, reproducing the Network Isolation failure so the blocked-connection
  # report reflects npm's own traffic rather than a successful mirrored restore.
  - name: redirectNpmToInternalFeed
    displayName: Redirect npm to the 1ES internal mirror
    type: boolean
    default: true

resources:
  repositories:
    - repository: templates
      type: git
      name: OneBranch.Pipelines/GovernedTemplates
      ref: refs/heads/main

variables:
  CDP_DEFINITION_BUILD_COUNT: $[counter('', 0)]
  WindowsContainerImage: 'onebranch.azurecr.io/windows/ltsc2022/vse2022:latest'

  # package-lock.json intentionally references the public npm registry so the repo
  # works for external contributors. Network Isolation blocks registry.npmjs.org in
  # the build container, so npm is redirected to the 1ES public mirror here. npm's
  # default replace-registry-host=npmjs rewrites the public-registry tarball hosts
  # in the lockfile to this feed, so no internal URLs are committed.
  #
  # Declared as a pipeline variable rather than step-level env so it applies at
  # environment precedence (cli > env > project .npmrc > user .npmrc) to every step.
  # That matters because restore is not driven by a single task -- the `npx vsce`
  # invocations below inherit the agent environment too. Azure Pipelines exports
  # this as NPM_CONFIG_REGISTRY, and npm matches npm_config_* case insensitively.
  #
  # Omitted entirely when redirectNpmToInternalFeed is false so npm falls back to
  # its default registry for diagnostic runs.
  ${{ if parameters.redirectNpmToInternalFeed }}:
    npm_config_registry: 'https://ms-feed-25.pkgs.visualstudio.com/1es-public/_packaging/npm-public/npm/registry/'

  VsixName: vscode-edge-devtools.vsix
  ManifestName: extension.manifest
  SignatureName: extension.signature.p7s

extends:
  template: v2/OneBranch.Official.CrossPlat.yml@templates
  parameters:
    cloudvault:
      enabled: false
    globalSdl:
      tsa:
        enabled: true
      binskim:
        break: true
      policheck:
        break: true
      codeSignValidation:
        excludes: '-|**\*.vsix;-|**\*.vsix\**'

    stages:
      - stage: build
        displayName: Build, package and sign
        jobs:
          - job: build_extension
            displayName: Build and sign extension
            pool:
              type: windows
            variables:
              ob_outputDirectory: '$(Build.ArtifactStagingDirectory)'

            steps:
              - task: UseNode@1
                displayName: 'Use Node.js 22.x'
                inputs:
                  versionSource: 'spec'
                  version: '22.x'

              - script: git config --global core.autocrlf false
                displayName: 'Configure Git LF settings'

              # TEMPORARY DIAGNOSTIC -- remove once the registry question is settled.
              # Probes every tarball URL in package-lock.json from inside the isolated
              # container and reports which are unreachable. This distinguishes a
              # domain-wide block on registry.npmjs.org (all URLs fail) from a single
              # offending dependency (only some fail). Runs before npm ci and never
              # fails the build.
              - pwsh: |
                  $js = Join-Path $env:AGENT_TEMPDIRECTORY 'probe-registry.js'
                  @'
                  const fs = require('fs'), https = require('https'), { URL } = require('url');
                  const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
                  const targets = [];
                  for (const [name, v] of Object.entries(lock.packages || {}))
                    if (v && typeof v.resolved === 'string' && v.resolved.startsWith('http'))
                      targets.push({ name: name || '<root>', url: v.resolved, host: new URL(v.resolved).host });
                  const tally = (arr) => arr.reduce((a, t) => ((a[t.host] = (a[t.host] || 0) + 1), a), {});
                  console.log('=== lockfile tarball hosts ===');
                  for (const [h, c] of Object.entries(tally(targets))) console.log('  ' + c + '  ' + h);
                  console.log('\nnpm_config_registry = ' + (process.env.NPM_CONFIG_REGISTRY || '<unset>'));
                  console.log('probing ' + targets.length + ' URLs...\n');
                  const probe = (t) => new Promise((res) => {
                    const req = https.get(t.url, { headers: { Range: 'bytes=0-0' } }, (r) => { r.destroy(); res({ ...t, status: r.statusCode }); });
                    req.on('error', (e) => res({ ...t, status: 'ERR ' + (e.code || e.message) }));
                    req.setTimeout(20000, () => { req.destroy(); res({ ...t, status: 'TIMEOUT' }); });
                  });
                  (async () => {
                    const bad = [], q = targets.slice();
                    await Promise.all(Array.from({ length: 10 }, async () => {
                      while (q.length) { const r = await probe(q.shift()); if (!(typeof r.status === 'number' && r.status < 400)) bad.push(r); }
                    }));
                    console.log('=== UNREACHABLE: ' + bad.length + ' of ' + targets.length + ' ===');
                    for (const [h, c] of Object.entries(tally(bad))) console.log('  ' + c + '  ' + h);
                    console.log('');
                    for (const b of bad.slice(0, 40)) console.log('  [' + b.status + '] ' + b.name);
                    if (bad.length > 40) console.log('  ...and ' + (bad.length - 40) + ' more');
                  })();
                  '@ | Set-Content -Path $js -Encoding utf8
                  node $js
                displayName: 'TEMP: probe registry reachability'
                workingDirectory: '$(Build.SourcesDirectory)'
                continueOnError: true

              - script: npm ci
                displayName: 'Install dependencies (npm ci)'
                workingDirectory: '$(Build.SourcesDirectory)'

              - script: npm run build-and-lint
                displayName: 'Build and lint'
                workingDirectory: '$(Build.SourcesDirectory)'

              - script: npm run test
                displayName: 'Test'
                workingDirectory: '$(Build.SourcesDirectory)'

              - script: npm run package
                displayName: 'Package VSIX'
                workingDirectory: '$(Build.SourcesDirectory)'

              - ${{ if parameters.signingEnabled }}:
                  - pwsh: |
                      npx vsce generate-manifest -i "$(VsixName)" -o "$(ManifestName)"
                      if ($LASTEXITCODE -ne 0) { throw "vsce generate-manifest failed" }

                      Copy-Item "$(ManifestName)" "$(SignatureName)" -Force

                      New-Item -ItemType Directory -Force -Path "$(STAGING_DIR)/tosign" | Out-Null
                      Move-Item "$(SignatureName)" "$(STAGING_DIR)/tosign/$(SignatureName)" -Force
                    displayName: 'Generate manifest and stage file to sign'
                    workingDirectory: '$(Build.SourcesDirectory)'

                  - task: EsrpCodeSigning@6
                    displayName: "ESRP Codesigning - MI"
                    inputs:
                      ConnectedServiceName: '$(esrpServiceConnectionName)'
                      AppRegistrationClientId: '$(esrpAppRegistrationClientId)'
                      AppRegistrationTenantId: '$(esrpAppRegistrationTenantId)'
                      AuthAKVName: '$(esrpAuthKeyVaultName)'
                      AuthSignCertName: '$(esrpRequestSigningCertName)'
                      UseMSIAuthentication: true
                      EsrpClientId: '$(esrpClientId)'

                      FolderPath: '$(STAGING_DIR)/tosign'
                      Pattern: '$(SignatureName)'
                      signConfigType: inlineSignParams
                      SessionTimeout: 90
                      MaxConcurrency: 25
                      MaxRetryAttempts: 5
                      PendingAnalysisWaitTimeoutMinutes: 5
                      inlineOperation: |
                        [
                          {
                            "keyCode": "$(esrpKeyCode)",
                            "operationSetCode": "$(esrpOperationSetCode)",
                            "parameters": [],
                            "toolName": "sign",
                            "toolVersion": "1.0"
                          }
                        ]

                  - pwsh: |
                      Move-Item "$(STAGING_DIR)/tosign/$(SignatureName)" `
                                "$(Build.SourcesDirectory)/$(SignatureName)" -Force
                    displayName: 'Collect signed signature file'
                    workingDirectory: '$(Build.SourcesDirectory)'

                  - pwsh: |
                      $sig = "$(Build.SourcesDirectory)/$(SignatureName)"
                      $man = "$(Build.SourcesDirectory)/$(ManifestName)"

                      if (-not (Test-Path $sig)) {
                          throw "Signature file '$(SignatureName)' was not produced -- signing failed."
                      }

                      $len = (Get-Item $sig).Length
                      Write-Host "Signature file size: $len bytes"
                      if ($len -eq 0) { throw "Signature file is empty -- signing failed." }

                      $sigHash = (Get-FileHash $sig -Algorithm SHA256).Hash
                      $manHash = (Get-FileHash $man -Algorithm SHA256).Hash
                      if ($sigHash -eq $manHash) {
                          throw "Signature file is still identical to the manifest -- signing did not run."
                      }
                    displayName: 'Verify signature file was produced'

                  - pwsh: |
                      $output = & npx vsce verify-signature `
                        --packagePath "$(VsixName)" `
                        --manifestPath "$(ManifestName)" `
                        --signaturePath "$(SignatureName)" 2>&1 | Out-String
                      Write-Host $output

                      if ($output -notmatch 'publisher primary signature') {
                          throw "verify-signature did not report a publisher primary signature."
                      }
                    displayName: 'Verify signature against VSIX'
                    workingDirectory: '$(Build.SourcesDirectory)'

              - pwsh: |
                  $out = "$(STAGING_DIR)"
                  New-Item -ItemType Directory -Force -Path $out | Out-Null
                  foreach ($f in @("$(VsixName)", "$(ManifestName)", "$(SignatureName)")) {
                      if (Test-Path $f) { Copy-Item $f $out }
                  }
                  Remove-Item "$out/tosign" -Recurse -Force -ErrorAction SilentlyContinue
                  Get-ChildItem $out | Format-Table Name, Length
                displayName: 'Stage artifacts to ob_outputDirectory'
                workingDirectory: '$(Build.SourcesDirectory)'
